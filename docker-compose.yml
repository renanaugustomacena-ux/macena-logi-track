# LogiTrack — full-stack local development orchestration.
#
# Services:
#   logitrack-backend   Go/Gin API on :8080
#   logitrack-frontend  Vue 3 SPA on :5174 (nginx in prod)
#   logitrack-mongodb   MongoDB 7 with auth, host-bound on 127.0.0.1:27017
#   logitrack-redis     Redis 7 with requirepass, host-bound on 127.0.0.1:6380
#   logitrack-simulator optional telematics simulator (profile: demo)
#
# Production-hardening pass (2026-04-27):
#   - Mongo + Redis now require credentials. The previous default
#     was unauthenticated, and the published ports were on
#     0.0.0.0 — anyone on the host LAN could connect read/write
#     without a password.
#   - Both services now bind to 127.0.0.1 only. Containers on the
#     compose network still talk to them by name (logitrack-mongodb,
#     logitrack-redis) at the unbound internal port.
#   - Credentials default to dev-only placeholders that let
#     `cp .env.example .env && docker compose up` work, but they
#     are documented as DEV-ONLY in .env.example. Production
#     deployments must rotate these via secret manager injection.
#
# Usage:
#   cp .env.example .env
#   # (edit .env at minimum: JWT_SECRET, MONGO_PASSWORD, REDIS_PASSWORD,
#   #  LOGITRACK_IDENTITY_DEMO_USER and LOGITRACK_IDENTITY_DEMO_PASSWORD)
#   docker compose up --build
#   docker compose --profile demo up --build    # include the simulator

services:
  logitrack-mongodb:
    image: mongo:7
    container_name: logitrack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-logitrack}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-logitrack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - logitrack-mongo-data:/data/db
      - logitrack-mongo-config:/data/configdb
    healthcheck:
      # Authenticated ping. CMD-SHELL form so $MONGO_INITDB_ROOT_*
      # interpolate at exec time inside the container; the bare CMD
      # array form passes them as literal strings.
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep -q 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  logitrack-redis:
    image: redis:7-alpine
    container_name: logitrack-redis
    restart: unless-stopped
    # requirepass is the simplest auth path for Redis 7. Production
    # deployments may prefer ACL users; redis-cli AUTH still works
    # against requirepass for backward compat.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      - "--save"
      - "60"
      - "1"
      - "--appendonly"
      - "no"
    environment:
      # Exposed to the healthcheck via $$ escape so compose passes
      # the literal $REDIS_PASSWORD into the container env.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      # CMD-SHELL form so $$REDIS_PASSWORD interpolates at exec time.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  logitrack-backend:
    build:
      context: ./backend
    container_name: logitrack-backend
    restart: unless-stopped
    depends_on:
      logitrack-mongodb:
        condition: service_healthy
      logitrack-redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      # Mongo URI carries credentials + authSource=admin so the
      # backend authenticates as the root user against the admin
      # database (which is where MONGO_INITDB_ROOT_USERNAME/PASSWORD
      # provisions the principal).
      MONGO_URI: "mongodb://${MONGO_ROOT_USERNAME:-logitrack}:${MONGO_ROOT_PASSWORD}@logitrack-mongodb:27017/?authSource=admin"
      MONGO_DB: ${MONGO_DB:-logitrack}
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@logitrack-redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      HTTP_CORS_ALLOWED: "http://localhost:5174,http://127.0.0.1:5174"
      HTTP_WS_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-logitrack-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_ALLOWED_HOSTS: "router.project-osrm.org,osrm.logitrack.local"
      OSRM_TRUCK_PROFILE: ${OSRM_TRUCK_PROFILE:-}
      AIDA_API_BASE: ${AIDA_API_BASE:-}
      LOGITRACK_IDENTITY_BACKEND: ${LOGITRACK_IDENTITY_BACKEND:-memory}
      LOGITRACK_IDENTITY_DEMO_USER: ${LOGITRACK_IDENTITY_DEMO_USER:-}
      LOGITRACK_IDENTITY_DEMO_PASSWORD: ${LOGITRACK_IDENTITY_DEMO_PASSWORD:-}
      LOGITRACK_IDENTITY_DEMO_TENANT: ${LOGITRACK_IDENTITY_DEMO_TENANT:-demo-tenant}
      LOGITRACK_IDENTITY_DEMO_ROLES: ${LOGITRACK_IDENTITY_DEMO_ROLES:-operator}
      SEED_DEMO: "true"
      SEED_DEMO_TENANT: ${SEED_DEMO_TENANT:-demo-tenant}
    ports:
      - "8080:8080"
    # Distroless runtime has no shell/wget; the backend exposes /api/health
    # over HTTP which the frontend/host probes directly. Compose healthcheck
    # is intentionally omitted; frontend uses `service_started` below.

  logitrack-frontend:
    build:
      context: ./frontend
    container_name: logitrack-frontend
    restart: unless-stopped
    depends_on:
      logitrack-backend:
        condition: service_started
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5174/"]
      interval: 15s
      timeout: 5s
      retries: 5

  logitrack-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    container_name: logitrack-simulator
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      logitrack-backend:
        condition: service_healthy
    environment:
      LOGITRACK_API_BASE: http://logitrack-backend:8080
      SIM_TENANT_ID: demo-tenant
      SIM_USER_ID: demo-sim
      SIM_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SIM_JWT_ISSUER: logitrack.it
      SIM_LOOP: "true"
      SIM_RATE_HZ: "1"

volumes:
  logitrack-mongo-data:
  logitrack-mongo-config:
