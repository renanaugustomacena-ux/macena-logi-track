# nginx config for the LogiTrack SPA.
#
# Hardening applied during the 2026-04-27 audit follow-up:
#   - HSTS header added (was missing entirely).
#   - server_tokens off so the nginx version is not leaked.
#   - /api/ proxy block added so the SPA can reach the backend in
#     production without an external load balancer terminating
#     /api separately. WebSocket upgrade headers are wired so the
#     /api/v1/stream/tracking subscription works through nginx.
#   - SPA fallback (try_files ... /index.html) scoped to non-asset
#     paths only so a missing /assets/foo.js returns 404 instead
#     of the SPA shell, which would otherwise produce a confusing
#     "Unexpected token <" parse error in the browser.
#   - Asset cache policy split: hashed /assets/* are immutable for
#     a year, the SPA shell is no-store so a deploy is picked up
#     immediately on next navigation.
#
# nginx add_header inheritance footgun: when a child block declares
# any add_header, every add_header from its parents is dropped — but
# when the child has zero add_header, the parents' headers ARE
# inherited. To keep the /api/ proxy from double-stamping headers
# the backend already emits, we declare zero add_header at server
# scope. Each SPA-only location re-declares the full set.

server_tokens off;

upstream logitrack_backend {
  server logitrack-backend:8080;
  keepalive 16;
}

server {
  listen 5174;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  client_max_body_size 4m;

  # /api/ proxy — terminates HTTP and WebSocket. Upgrade headers are
  # required for /api/v1/stream/tracking; proxy_read_timeout matches
  # the backend's WS idle timeout (5 minutes) so an idle connection
  # is not killed by nginx before the backend.
  #
  # Zero add_header directives here on purpose: the backend's
  # SecurityHeaders middleware already emits HSTS, X-Frame-Options,
  # X-Content-Type-Options, Referrer-Policy, Permissions-Policy and a
  # JSON-API-tight CSP (default-src 'none'). nginx passes those
  # through unchanged. Adding any add_header here would silently
  # drop inheritance from parent scope (we have none at parent
  # scope) — and adding the SPA-style headers here would replace the
  # tighter CSP the API surface deserves.
  location /api/ {
    proxy_pass http://logitrack_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
    proxy_buffering off;
  }

  # Hashed build assets — content-hashed by Vite, safe to cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  }

  # SPA fallback for client-routed paths. Anything that looks like an
  # asset (extension match) returns 404 on miss instead of being
  # rewritten to the SPA shell. Cache-Control: no-store so a deploy
  # is picked up immediately on next navigation.
  location / {
    try_files $uri /index.html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
  }
}
