name: pages

# Publishes the marketing landing page (landing-page/) to GitHub Pages.
# The Vue SPA in frontend/ is NOT deployed by this workflow — it is the
# customer-side application that lives behind authentication and is
# shipped via the docker-compose / k8s deployment paths covered by cd.yml.
#
# Pages must be enabled at repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - landing-page/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise concurrent deploys; the latest commit wins, in-flight builds
# for the same branch are cancelled to avoid out-of-order publishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing-page/ as Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing-page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
