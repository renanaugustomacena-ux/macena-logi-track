name: pages

# Publishes to GitHub Pages:
#   /            -> the marketing landing page (landing-page/)
#   /demo/       -> the Vue SPA built with VITE_DEMO_MODE=true,
#                   so every /api/* call is intercepted by a static
#                   mock and the dashboard works without a backend.
#
# Activate at repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - landing-page/**
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise concurrent deploys; latest commit wins, in-flight builds
# are cancelled to avoid out-of-order publishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Compute Pages base path
        id: base
        run: |
          # GitHub Pages serves the artefact at /<repo>/ for project
          # pages. Derive that prefix so the SPA's asset URLs resolve.
          echo "prefix=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build SPA in demo mode
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: |
          npx vite build --base="${{ steps.base.outputs.prefix }}/demo/"

      - name: Stage Pages artefact
        run: |
          mkdir -p _site
          cp -r landing-page/. _site/
          mkdir -p _site/demo
          cp -r frontend/dist/. _site/demo/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
